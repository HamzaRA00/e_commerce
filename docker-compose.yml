services:
    app:
        image: ecommerce-app:local
        build:
            context: .
            dockerfile: Dockerfile

        env_file:
            - .env.docker
        depends_on:
            rabbitmq:
                condition: service_healthy
            db:
                condition: service_healthy
            redis:
                condition: service_healthy
        volumes:
            - .:/var/www/html
            - app_public:/var/www/html/public
            - app_storage:/var/www/html/storage

    web:
        image: nginx:1.27-alpine
        ports:
            - "8000:80"
        volumes:
            - app_public:/var/www/html/public:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app

    phpmyadmin:
        image: phpmyadmin:5-apache
        ports:
            - "8080:80"
        environment:
            PMA_HOST: db
            PMA_PORT: 3306
            MYSQL_ROOT_PASSWORD: root
        depends_on:
            db:
                condition: service_healthy

    db:
        image: mysql:8.4
        command: --server-id=1 --log-bin=mysql-bin --binlog-format=ROW
        environment:
            MYSQL_DATABASE: ecommerce
            MYSQL_USER: ecommerce
            MYSQL_PASSWORD: ecommerce
            MYSQL_ROOT_PASSWORD: root
        volumes:
            - db_data:/var/lib/mysql
            - ./docker/mysql/primary-init.sql:/docker-entrypoint-initdb.d/01-primary-init.sql:ro
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent",
                ]
            interval: 5s
            timeout: 5s
            retries: 20

    db_replica:
        image: mysql:8.4
        command: --server-id=2 --relay-log=replica-relay-bin
        environment:
            MYSQL_DATABASE: ecommerce
            MYSQL_USER: ecommerce
            MYSQL_PASSWORD: ecommerce
            MYSQL_ROOT_PASSWORD: root
        volumes:
            - db_replica_data:/var/lib/mysql
            - ./docker/mysql/replica-init.sh:/docker-entrypoint-initdb.d/01-replica-init.sh:ro
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent",
                ]
            interval: 5s
            timeout: 5s
            retries: 20
    redis:
        image: redis:7-alpine
        command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10
    warehouse_db:
        image: mysql:8.0-debian
        environment:
            MYSQL_DATABASE: warehouse
            MYSQL_USER: warehouse
            MYSQL_PASSWORD: warehouse
            MYSQL_ROOT_PASSWORD: root
        volumes:
            - warehouse_db_data:/var/lib/mysql
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent",
                ]
            interval: 5s
            timeout: 5s
            retries: 20

    rabbitmq:
        image: rabbitmq:4-management
        hostname: rabbitmq
        environment:
            RABBITMQ_DEFAULT_USER: ecommerce
            RABBITMQ_DEFAULT_PASS: change-this-local-password
            RABBITMQ_DEFAULT_VHOST: /
        ports:
            - "5672:5672"
            - "15672:15672"
        volumes:
            - rabbitmq_data:/var/lib/rabbitmq
        healthcheck:
            test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
            interval: 10s
            timeout: 5s
            retries: 10
        restart: unless-stopped

    reverb:
        image: ecommerce-app:local
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        env_file:
            - .env.docker
        ports:
            - "8081:8080"
        volumes:
            - .:/var/www/html
            - app_storage:/var/www/html/storage
        depends_on:
            - app
        restart: unless-stopped

    queue-worker:
        image: ecommerce-app:local
        command: >
            php artisan rabbitmq:consume
            --queue=default
            --consume-mode=poll
            --memory=256
            --tries=3
            --timeout=60
        env_file:
            - .env.docker
        volumes:
            - .:/var/www/html
            - app_storage:/var/www/html/storage
        depends_on:
            db:
                condition: service_healthy
            rabbitmq:
                condition: service_healthy
        restart: unless-stopped

    warehouse:
        image: node:22-bookworm-slim
        working_dir: /app
        command: node dist/main.js
        volumes:
            - ./warehouse_service:/app
        environment:
            DB_HOST: warehouse_db
            DB_PORT: 3306
            DB_USER: warehouse
            DB_PASSWORD: warehouse
            DB_NAME: warehouse
        depends_on:
            warehouse_db:
                condition: service_healthy
    frontend:
        image: ecommerce-frontend:local
        build:
            context: ./frontend
            dockerfile: Dockerfile
            target: dev
        ports:
            - "5173:5173"
        environment:
            VITE_PROXY_TARGET: http://web:80
            VITE_ADMIN_URL: http://localhost:5174
            VITE_REVERB_APP_KEY: luffy
            VITE_REVERB_HOST: localhost
            VITE_REVERB_PORT: 8081
            VITE_REVERB_SCHEME: http
        volumes:
            - ./frontend:/app
            - /app/node_modules
        depends_on:
            - web

    admin:
        image: ecommerce-admin:local
        build:
            context: ./admin
            dockerfile: Dockerfile
            target: dev
        ports:
            - "5174:5174"
        environment:
            VITE_PROXY_TARGET: http://web:80
            VITE_STOREFRONT_URL: http://localhost:5173
            VITE_REVERB_APP_KEY: luffy
            VITE_REVERB_HOST: localhost
            VITE_REVERB_PORT: 8081
            VITE_REVERB_SCHEME: http
        volumes:
            - ./admin:/app
            - /app/node_modules
        depends_on:
            - web

volumes:
    app_public:
    app_storage:
    db_data:
    warehouse_db_data:
    db_replica_data:
    rabbitmq_data:
